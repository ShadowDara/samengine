name: Release Seg

on:
  push:
    tags:
      - "seg-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os: windows-latest
            target: x86_64-pc-windows-msvc

          - os: macos-15
            target: x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: crates/seg
        run: cargo build --release --target ${{ matrix.target }}

      # optional: upload only for debugging (not required)
      - name: Upload binary (debug)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: crates/seg/target/${{ matrix.target }}/release/seg*

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-npm
        run: cargo install cargo-npm

      # 🔥 IMPORTANT: rebuild locally so cargo-npm sees correct target layout
      - name: Build Linux (for npm packaging context)
        working-directory: crates/seg
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Generate npm packages
        working-directory: crates/seg
        run: cargo npm generate

      - name: Publish npm packages
        working-directory: crates/seg
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cargo npm publish
