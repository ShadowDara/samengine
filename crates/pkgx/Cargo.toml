# A package manager in Rust

[package]
name = "pkgx"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"

sha2 = "0.10"
blake3 = "1.5"

zip = "2"

reqwest = { version = "0.12", features = ["blocking"] }

anyhow = "1"

directories = "5"
