# Not Published

[package]
name = "samfileparser"
version = "0.1.11"
edition = "2024"
authors = ["Shadowdara"]
readme = "README.md"
description = "a little Makefile inspired Command file"
license = "Apache-2.0"
include = ["LICENSE", "README.md", "Cargo.toml", "/src/", "buildin.samfile"]
keywords = ["cmd", "cmdfile", "samfile"]
repository = "https://github.com/shadowdara/samengine"
build = "build.rs"

[dependencies]
fluaterm = "0.2.2"
fs_extra = "1"
regex = "1"
shlex = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parser_bench"
harness = false
